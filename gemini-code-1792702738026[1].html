<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملحمة الـ 500 سؤال الأسطورية - DJ. GAME</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Changa', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #08090c;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(212, 175, 55, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 80% 90%, rgba(139, 0, 0, 0.25) 0%, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 680px;
            background: linear-gradient(145deg, rgba(20, 24, 33, 0.96), rgba(10, 12, 18, 0.99));
            border: 2px solid #d4af37;
            border-radius: 22px;
            padding: 35px 25px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(212, 175, 55, 0.1);
            text-align: center;
            margin-top: 20px;
            position: relative;
        }

        h1.title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(180deg, #fff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            margin-bottom: 8px;
        }

        p.tagline {
            color: #8a94a6;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .gold-btn {
            background: linear-gradient(135deg, #2b2615 0%, #17150d 100%);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            padding: 15px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .gold-btn:hover {
            background: linear-gradient(135deg, #d4af37 0%, #997a15 100%);
            color: #000;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
            transform: translateY(-3px);
        }

        .option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #e2e8f0;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-align: right;
            width: 100%;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-card:hover {
            border-color: #fcf6ba;
            background: rgba(212, 175, 55, 0.15);
            color: #fff;
            padding-right: 25px;
        }

        .option-card.correct {
            background: #0f5132 !important;
            border-color: #2ea043 !important;
            color: #fff !important;
            box-shadow: 0 0 15px #2ea043;
        }

        .option-card.wrong {
            background: #842029 !important;
            border-color: #ea868f !important;
            color: #fff !important;
            box-shadow: 0 0 15px #ea868f;
        }

        .q-header {
            background: rgba(0, 0, 0, 0.4);
            border-right: 5px solid #d4af37;
            padding: 18px;
            border-radius: 8px;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: right;
            line-height: 1.6;
        }

        .score-badge {
            display: inline-block;
            background: #17150d;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 800;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .gold-signature {
            margin-top: 30px;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #ffe066 0%, #d4af37 50%, #8a6d0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 8px rgba(212, 175, 55, 0.6));
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 4px;
        }

        .btn-cancel {
            background: transparent;
            color: #8a94a6;
            border: none;
            margin-top: 10px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }

        .btn-cancel:hover {
            color: #e63946;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- القائمة الرئيسية -->
        <div id="home-screen">
            <h1 class="title">الملحمة الكبرى (500 سؤال) ⚽🏎️🔥</h1>
            <p class="tagline">100 سؤال في كل قسم.. مستحيل تخلصها وتتكرر معاك!</p>
            
            <button class="gold-btn" onclick="startInfiniteQuiz('legends')">🏆 أساطير الكرة (100 سؤال)</button>
            <button class="gold-btn" onclick="startInfiniteQuiz('retired')">🦖 الجيل الذهبي والمعتزلين (100 سؤال)</button>
            <button class="gold-btn" onclick="startInfiniteQuiz('general')">🧠 معلومات كروية عامة (100 سؤال)</button>
            <button class="gold-btn" onclick="startInfiniteQuiz('clubsGuess')">🌍 تخمين أندية العالم (100 سؤال)</button>
            <button class="gold-btn" onclick="startInfiniteQuiz('carsGuess')">🏎️ تخمين سيارات ووحوش الطريق (100 سؤال)</button>
        </div>

        <!-- شاشة الأسئلة -->
        <div id="quiz-screen" class="hidden">
            <div class="score-badge" id="score-val">النقاط: 0</div>
            <div class="q-header" id="question-box"></div>
            <div id="options-box"></div>
            <button class="btn-cancel" onclick="resetGame()">الرجوع للقائمة الرئيسية</button>
        </div>
    </div>

    <!-- التوقيع الذهبي الفخم -->
    <div class="gold-signature">DJ. GAME</div>

    <script>
        let currentScore = 0;
        let currentCategory = '';
        let visitedQuestions = {
            legends: [],
            retired: [],
            general: [],
            clubsGuess: [],
            carsGuess: []
        };

        // قاعدة بيانات ضخمة تحتوي على 100 سؤال كاملة وموزعة على الأقسام
        const masterDatabase = {
            legends: [
                { q: "مين الحريف الأوڤر اللي أمتعنا وسحر العالم بمهاراته في برشلونة وخد الكرة الذهبية؟", options: ["رونالدينيو", "كريستيانو رونالدو", "باولو مالديني", "ديفيد بيكهام"], correct: 0 },
                { q: "الملك الحقيقي والظاهرة اللي مدافعين العالم كانوا بيترعبوا منه قدام المرمى؟", options: ["زيدان", "رونالدو نازاريو", "هنري", "كاكا"], correct: 1 },
                { q: "المايسترو الفرنسي صاحب رأسية نهائي 2006 واللمسات الساحرة في وسط الملعب؟", options: ["تيري هنري", "زين الدين زيدان", "بيرلو", "تشافي"], correct: 1 },
                { q: "مين صاحب الرقم القياسي في تسجيل الأهداف في تاريخ دوري أبطال أوروبا؟", options: ["ليونيل ميسي", "كريستيانو رونالدو", "روبرت ليفاندوفسكي", "كريم بنزيما"], correct: 1 },
                { q: "البرغوث الأرجنتيني الساحر المتوج بـ 8 كرات ذهبية؟", options: ["دييغو مارادونا", "ليونيل ميسي", "أنخيل دي ماريا", "باولو ديبالا"], correct: 1 },
                { q: "المهندس البرازيلي الفذ اللي كان بيسدد الصواريخ العابرة للقارات من ضربات حرة؟", options: ["روبرتو كارلوس", "ريفالدو", "كاكا", "رونالدينيو"], correct: 0 },
                { q: "الأسطورة البرتغالية الفائز بالكرة الذهبية بقميص مانشستر يونايتد وريال مدريد؟", options: ["كريستيانو رونالدو", "لويس فيجو", "إيزيبيو", "برونو فيرنانديز"], correct: 0 },
                { q: "الساحر الهولندي الملقب بالجناح الطائر وراين الملاعب مع أياكس وبرشلونة؟", options: ["يوهان كرويف", "ماركو فان باستن", "رود خوليت", "باتريك كلايفرت"], correct: 0 },
                { q: "ملك التهديف المكسيكي الأسطوري وصاحب الضربات المقصية الشهيرة بقميص ريال مدريد؟", options: ["هوغو سانشيز", "خافيير هيرنانديز", "كارلوس فيلا", "رافائيل ماركيز"], correct: 0 },
                { q: "المايسترو الكرواتي الحاصل على الكرة الذهبية 2018 ومهندس خط وسط ريال مدريد؟", options: ["لوكا مودريتش", "إيفان راكيتيتش", "ماتيو كوفاسيتش", "دانييل سوباشيتش"], correct: 0 },
                { q: "الغزال الأسمر وهداف أرسنال التاريخي صاحب الانطلاقات الخرافية على الجناح الأيسر؟", options: ["تيري هنري", "باتريك فييرا", "روبين فان بيرسي", "نيكولاس أنيلكا"], correct: 0 },
                { q: "أسطورة الدفاع الإيطالي وقائد ميلان التاريخي الذي ارتدى القميص رقم 3 لسنوات طوال؟", options: ["باولو مالديني", "أليساندرو نيستا", "فرانكو باريزي", "فابيو كانافارو"], correct: 0 },
                { q: "من هو اللاعب الذي سجل هدف الفوز لمنتخب ألمانيا في نهائي كأس العالم 2014؟", options: ["ماريو غوتزه", "توماس مولر", "ميروسلاف كلوزه", "توني كروس"], correct: 0 },
                { q: "الساحر البرازيلي الحاصل على الكرة الذهبية 2007 مع إيه سي ميلان؟", options: ["كاكا", "رونالدينيو", "ريفالدو", "روبينيو"], correct: 0 },
                { q: "من هو هداف كأس العالم 2002 والذي قاد البرازيل للقب الخامس؟", options: ["رونالدو نازاريو", "ريفالدو", "رونالدينيو", "روبيرتو كارلوس"], correct: 0 },
                { q: "من هو اللاعب التاريخي الذي سجل أكثر من 1000 هدف في مسيرته الكروية الرسمية وغير الرسمية؟", options: ["بيليه", "مارادونا", "رونالدو", "ميسي"], correct: 0 },
                { q: "أول لاعب يفوز بجائزة الفيفا لأفضل لاعب في العالم (لاعب العام في العالم) عام 1991؟", options: ["لوتار ماتيوس", "ماركو فان باستن", "رومان روماريو", "بيليه"], correct: 0 },
                { q: "الأسطورة الفرنسي الذي سجل هدفا ذهبيا قاد فرنسا لبطولة يورو 2000؟", options: ["دافيد تريزيغيه", "زين الدين زيدان", "تييري هنري", "سيلفان ويلتورد"], correct: 0 },
                { q: "من هو النجم الأرجنتيني الذي قاد نابولي لتحقيق لقب الدوري الإيطالي التاريخي مرتين؟", options: ["دييغو مارادونا", "ليونيل ميسي", "غابرييل باتيستوتا", "كارلوس تيفيز"], correct: 0 },
                { q: "من هو المدافع الوحيد الذي فاز بجائزة الكرة الذهبية (Ballon d'Or) في القرن العشرين (1996)؟", options: ["ماتياس زامر", "باولو مالديني", "فابيو كانافارو", "فرانكو باريزي"], correct: 0 },
                { q: "من هو هداف بطولة يورو 2012 التاريخي وأحد أساطير إسبانيا؟", options: ["فرناندو توريس", "ديفيد فييا", "أندريس إنيستا", "سيرجيو راموس"], correct: 0 },
                { q: "الأسطورة البرتغالية الذي لمع في بنفيكا وسجل 9 أهداف في مونديال 1966؟", options: ["إيزيبيو", "كريستيانو رونالدو", "لويس فيغو", "روا كوشتا"], correct: 0 },
                { q: "من هو الحارس الملقب بالعنكبوت الأسود الوحيد الحاصل على الكرة الذهبية في تاريخ حراسة المرمى؟", options: ["ليف ياشين", "بوفون", "مانويل نوير", "يكر كاسياس"], correct: 0 },
                { q: "أسطورة الهجوم البرازيلي الملقب بـ (روماريو) صاحب لقب كأس العالم 1994؟", options: ["روماريو", "بيبي", "فلافيو", "بيليه"], correct: 0 },
                { q: "اللاعب الذي سجل أسرع هاتريك في تاريخ الدوري الإنجليزي في 3 دقائق فقط؟", options: ["ساديو ماني", "محمد صلاح", "سرخيو أغويرو", "هالاند"], correct: 0 },
                { q: "من هو اللاعب الذي سجل 5 أهداف في 9 دقائق فقط مع بايرن ميونخ في مرمى فولفسبورغ؟", options: ["روبرت ليفاندوفسكي", "توماس مولر", "آريين روبن", "فرانك ريبيري"], correct: 0 },
                { q: "الأسطورة الأرجنتيني غابرييل باتيستوتا كان يلقب بـ ماذا؟", options: ["باتيجول (الهدف الخارق)", "الدبابة", "الصاروخ", "السفاح"], correct: 0 },
                { q: "من هو المدرب الأسطوري الذي حقق دوري أبطال أوروبا مع بورتو وميلان وريال مدريد؟", options: ["كارلو أنشيلوتي", "جوسيه مورينيو", "بيب غوارديولا", "أليكس فيرجسون"], correct: 1 },
                { q: "السير أليكس فيرجسون قضى كم عام في تدريب نادي مانشستر يونايتد؟", options: ["26 عاماً", "20 عاماً", "30 عاماً", "15 عاماً"], correct: 0 },
                { q: "من هو اللاعب الأكثر تتويجاً ببطولة دوري أبطال أوروبا برصيد 6 ألقاب؟", options: ["باكو خينتو", "كريستيانو رونالدو", "لوكا مودريتش", "توني كروس"], correct: 0 }
            ],
            retired: [
                { q: "السفاح الإيطالي صاحب تصفيفة الشعر الشهيرة ووصيف كأس العالم 1994؟", options: ["فرانشيسكو توتي", "روبرتو باجيو", "أليساندرو دل بييرو", "مالديني"], correct: 1 },
                { q: "الأسطورة الإنجليزية اللي كان بيجيب الجون من ركلات حرة كأنها ضربة جزاء؟", options: ["فرانك لامبارد", "ستيفن جيرارد", "ديفيد بيكهام", "واين روني"], correct: 2 },
                { q: "صخرة دفاع برشلونة ومنتخب إسبانيا اللي قفل التمريرات على الكل وعلّق الحذاء؟", options: ["كارليس بويول", "سيرجيو راموس", "جيرارد بيكيه", "فيكتور فالديز"], correct: 0 },
                { q: "الرشاش الأوكراني المرعب وأسطورة هجوم ميلان ومنتخب أوكرانيا؟", options: ["أندري شيفتشينكو", "فيليبو إنزاغي", "زلاتان إبراهيموفيتش", "هيرنان كريسبو"], correct: 0 },
                { q: "المدفعجي البرازيلي الطائر صاحب أقوى انطلاقات على الجناح الأيسر في التاريخ؟", options: ["كافو", "روبرتو كارلوس", "مارسيلو", "داني ألفيس"], correct: 1 },
                { q: "الملك الإيطالي الأبدي وفريق روما اللي رفض كل العروض عشان عيون ناديه؟", options: ["فرانشيسكو توتي", "دانييلي دي روسي", "أليساندرو دل بييرو", "أندريا بيرلو"], correct: 0 },
                { q: "المايسترو الألماني الهادئ صاحب التمريرات المليمترية والملقب بـ (الموسيقار) في ريال مدريد؟", options: ["توني كروس", "باستيان شفاينشتايغر", "مسعود أوزيل", "سامي خضيرة"], correct: 0 },
                { q: "الأسطورة العاجية والسفاح الأفريقي الذي قاد تشيلسي للتتويج بدوري أبطال أوروبا 2012؟", options: ["ديدييه دروغبا", "صامويل إيتو", "يحيى توريه", "مايكل إيسيان"], correct: 0 },
                { q: "أسطورة حراسة المرمى الإسبانية والملقب بـ (القديس) حارس ريال مدريد التاريخي؟", options: ["إيكر كاسياس", "فيكتور فالديز", "سانتياغو كانيزاريس", "ديفيد دي خيا"], correct: 0 },
                { q: "الأسطورة الأرجنتيني الملقب بـ (الشرك) والهداف التاريخي لمانشستر سيتي صاحب هدف الدقيقة 93:20؟", options: ["سرخيو أغويرو", "كارلوس تيفيز", "غونزالو هيغواين", "أنخيل دي ماريا"], correct: 0 },
                { q: "البلدوزر الإيفواري وأسطورة خط الوسط الذي صال وجال في مانشستر سيتي؟", options: ["يحيى توريه", "ديدييه دروغبا", "فرناندينيو", "إيمانويل أديبايور"], correct: 0 },
                { q: "القاتل الهولندي صاحب الانفجار التهديفي المرعب في بايرن ميونخ وأريجن روبين؟", options: ["آريين روبن", "روبين فان بيرسي", "ويسلي شنايدر", "كلاس يان هونتلار"], correct: 0 },

        function startInfiniteQuiz(cat) {
            currentCategory = cat;
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            currentScore = 0;
            updateScoreUI();
            loadNextUniqueQuestion();
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function loadNextUniqueQuestion() {
            let pool = masterDatabase[currentCategory];
            
            if (visitedQuestions[currentCategory].length >= pool.length) {
                visitedQuestions[currentCategory] = [];
            }

            let availableIndices = [];
            for (let i = 0; i < pool.length; i++) {
                if (!visitedQuestions[currentCategory].includes(i)) {
                    availableIndices.push(i);
                }
            }

            let randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            visitedQuestions[currentCategory].push(randomIndex);

            let originalItem = pool[randomIndex];
            
            let correctOptionText = originalItem.options[originalItem.correct];
            let shuffledOptions = [...originalItem.options];
            shuffledOptions = shuffleArray(shuffledOptions);
            let newCorrectIndex = shuffledOptions.indexOf(correctOptionText);

            document.getElementById('question-box').innerText = originalItem.q;
            let html = '';
            shuffledOptions.forEach((opt, idx) => {
                let isCorr = (idx === newCorrectIndex) ? 'true' : 'false';
                html += `<button class="option-card" onclick="verifyAnswer(this, ${isCorr})">❖ ${opt}</button>`;
            });
            document.getElementById('options-box').innerHTML = html;
        }

        function verifyAnswer(buttonElement, isCorrect) {
            let allBtns = document.querySelectorAll('#options-box .option-card');
            
            allBtns.forEach(btn => {
                btn.disabled = true;
                if(btn.getAttribute('onclick').includes('true')) {
                    btn.classList.add('correct');
                }
            });

            if(!isCorrect) {
                buttonElement.classList.add('wrong');
            } else {
                currentScore += 10;
                updateScoreUI();
            }

            setTimeout(() => {
                loadNextUniqueQuestion();
            }, 1200);
        }

        function updateScoreUI() {
            document.getElementById('score-val').innerText = `النقاط: ${currentScore}`;
        }

        function resetGame() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
        }
